        * { box-sizing: border-box; -webkit-user-select: none; user-select: none; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #08020d; color: #f3f4f6; margin: 0; padding: 0; padding-bottom: 90px;
            text-align: center; overflow-x: hidden; -webkit-font-smoothing: antialiased;
        }
        .top-navbar {
            background: linear-gradient(180deg, #180524 0%, #08020d 100%);
            padding: 15px 10px; border-bottom: 2px solid #ff0055;
            box-shadow: 0 4px 15px rgba(255, 0, 85, 0.3);
        }
        .header-title {
            color: #ff0055; font-size: 24px; margin: 5px 0; font-weight: 900;
            text-transform: uppercase; letter-spacing: 1px; text-shadow: 0 0 10px rgba(255, 0, 85, 0.6);
        }
        .badge-18plus {
            background: #ff0055; color: #fff; padding: 3px 10px; font-size: 11px;
            border-radius: 4px; font-weight: 800; display: inline-block; box-shadow: 0 0 8px #ff0055;
        }
        .direct-link-btn {
            display: flex; align-items: center; justify-content: center; gap: 10px;
            background: linear-gradient(135deg, #e11d48, #9333ea); color: white;
            text-decoration: none; padding: 14px; border-radius: 12px; font-weight: 800;
            font-size: 15px; margin: 15px 10px; box-shadow: 0 4px 20px rgba(225, 29, 72, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.2); transition: transform 0.2s ease;
        }
        .direct-link-btn:active { transform: scale(0.98); }

        .video-card {
            background: #12061c; border-radius: 14px; padding: 12px; margin: 15px 10px;
            border: 1px solid #2a0e3d; box-shadow: 0 6px 16px rgba(0,0,0,0.6); text-align: left;
        }
        .video-title { font-size: 16px; font-weight: 700; color: #e5e7eb; margin: 0 0 12px 0; display: flex; align-items: center; gap: 8px; }
        
        .video-wrapper {
            position: relative; width: 100%; border-radius: 10px; overflow: hidden;
            background: #000; border: 1px solid #ff005533; min-height: 240px;
        }
        .video-wrapper video { width: 100% !important; height: 100% !important; display: block; object-fit: contain; }

        .video-overlay-trigger {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.75); display: flex; flex-direction: column;
            align-items: center; justify-content: center; cursor: pointer; z-index: 99;
            backdrop-filter: blur(4px); transition: opacity 0.2s ease;
        }
        .play-btn-circle {
            width: 70px; height: 70px; background: linear-gradient(135deg, #ff0055, #c026d3);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 28px; color: #fff; box-shadow: 0 0 25px rgba(255, 0, 85, 0.9);
            padding-left: 5px; animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 0, 85, 0.7); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 15px rgba(255, 0, 85, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 0, 85, 0); }
        }
        
        .ad-container { margin: 15px 0; text-align: center; width: 100%; overflow: hidden; min-height: 250px; display: flex; align-items: center; justify-content: center; background: #0c0314; border-radius: 8px; border: 1px dashed #3b135c; }
        .sticky-ad-bottom {
            position: fixed; bottom: 0; left: 0; width: 100%; z-index: 999;
            background: rgba(8, 2, 13, 0.95); text-align: center; box-shadow: 0 -4px 15px rgba(0,0,0,0.8);
            border-top: 1px solid #ff005544; backdrop-filter: blur(5px);
        }

        #adminPanel {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #0d0414; z-index: 99999; overflow-y: auto; padding: 20px 15px; text-align: left;
        }
        #adminPanel h2 { color: #ff0055; margin-top: 0; border-bottom: 2px solid #ff0055; padding-bottom: 8px; font-size: 20px; }
        .admin-section { background: #180826; border: 1px solid #3b135c; padding: 15px; border-radius: 12px; margin-bottom: 20px; }
        #adminPanel label { font-size: 12px; color: #d1d5db; font-weight: bold; display: block; margin-top: 10px; }
        #adminPanel input {
            width: 100%; background: #0b0312; border: 1px solid #581c87;
            color: #38bdf8; padding: 10px; border-radius: 8px; font-family: monospace; font-size: 12px; margin-top: 4px;
        }
        .btn-action { background: linear-gradient(135deg, #16a34a, #15803d); color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 15px; width: 100%; }
        .btn-delete { background: #dc2626; color: white; border: none; padding: 6px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 12px; margin-top: 8px; }
        .close-admin-btn { background: #475569; color: white; border: none; padding: 10px; border-radius: 8px; width: 100%; margin-top: 10px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <!-- Isolated Admin Panel -->
    <div id="adminPanel">
        <h2>⚙️ Admin Control Panel</h2>
        <button class="close-admin-btn" onclick="closeAdmin()">❌ Close Admin View & Preview Site</button>
        
        <div class="admin-section" style="margin-top: 15px;">
            <h3>📹 Add New Video</h3>
            <label>ভিডিও টাইটেল (Video Title):</label>
            <input type="text" id="newVideoTitle" placeholder="যেমন: Exclusive Hot Clip 🔞">
            
            <label>ভিডিও লিংক (MP4 Direct Video URL):</label>
            <input type="text" id="newVideoUrl" placeholder="https://example.com/video.mp4">

            <label>VAST Ad Link (Optional):</label>
            <input type="text" id="newVideoAdUrl" placeholder="https://s.magsrv.com/v1/vast.php?idz=6040308">
            
            <button class="btn-action" onclick="addNewVideo()">➕ Add Video & Setup Ad</button>
        </div>

        <div class="admin-section">
            <h3>📂 Manage Posted Videos</h3>
            <div id="adminVideoList"></div>
        </div>
    </div>

    <!-- Main Visitor Interface -->
    <div class="top-navbar">
        <span class="badge-18plus">🔞 18+ ADULT CONTENT</span>
        <h1 class="header-title">🔥 VIP STREAM HUB</h1>
    </div>

    <div style="padding: 0 5px;">
        <!-- Top Banner Ad (Zone 6040370) -->
        <div class="ad-container">
            <script async type="application/javascript" src="https://a.magsrv.com/ad-provider.js"></script> 
            <ins class="eas6a97888e2" data-zoneid="6040370"></ins> 
            <script>(AdProvider = window.AdProvider || []).push({"serve": {}});</script>
        </div>

        <a href="https://t.me/hajhwijw" class="direct-link-btn" target="_blank">
            <i class="fab fa-telegram-plane"></i> VIP টেলিগ্রাম প্রাইভেট চ্যানেলে জয়েন করুন
        </a>

        <!-- Dynamic Videos Area -->
        <div id="videoContainer"></div>

        <!-- Bottom Banner Ad (Zone 6040370) -->
        <div class="ad-container">
            <script async type="application/javascript" src="https://a.magsrv.com/ad-provider.js"></script> 
            <ins class="eas6a97888e2" data-zoneid="6040370"></ins> 
            <script>(AdProvider = window.AdProvider || []).push({"serve": {}});</script>
        </div>
    </div>

    <!-- Sticky Bottom Ad (Zone 6040290) -->
    <div class="sticky-ad-bottom">
        <script async type="application/javascript" src="https://a.magsrv.com/ad-provider.js"></script> 
        <ins class="eas6a97888e17" data-zoneid="6040290"></ins> 
        <script>(AdProvider = window.AdProvider || []).push({"serve": {}});</script>
    </div>

    <script>
        const defaultAdTag = "https://s.magsrv.com/v1/vast.php?idz=6040308";

        const defaultVideos = [
            { id: 101, title: "🔥 Exclusive VIP Clip 01 🔞", url: "https://vjs.zencdn.net/v/oceans.mp4", adUrl: defaultAdTag },
            { id: 102, title: "💦 Hot Viral Stream 02 🔞", url: "https://vjs.zencdn.net/v/oceans.mp4", adUrl: defaultAdTag }
        ];

        let fluidPlayerInstances = {};

        function getVideos() {
            const saved = localStorage.getItem('site_videos');
            return saved ? JSON.parse(saved) : defaultVideos;
        }

        function saveVideos(videos) {
            localStorage.setItem('site_videos', JSON.stringify(videos));
            renderVideos();
            renderAdminVideoList();
        }

        function renderVideos() {
            const videos = getVideos();
            const container = document.getElementById('videoContainer');
            container.innerHTML = '';
            fluidPlayerInstances = {};

            videos.forEach((vid, index) => {
                const uniqueId = vid.id || (index + 1);
                const videoId = `video-player-${uniqueId}`;
                const card = document.createElement('div');
                card.className = 'video-card';
                card.innerHTML = `
                    <div class="video-title"><i class="fas fa-fire" style="color:#ff0055;"></i> ${vid.title}</div>
                    <div class="video-wrapper">
                        <div class="video-overlay-trigger" id="overlay-${uniqueId}" onclick="handleVideoClick(${uniqueId}, '${videoId}')">
                            <div class="play-btn-circle"><i class="fas fa-play"></i></div>
                            <span style="margin-top: 12px; font-weight: 800; font-size: 14px; color: #fff; text-shadow: 0 0 6px #000;">ভিডিও দেখতে এখানে ট্যাপ করুন</span>
                        </div>
                        <video id="${videoId}" controls preload="metadata" playsinline>
                            <source src="${vid.url}" type="video/mp4">
                        </video>
                    </div>
                `;
                container.appendChild(card);

                const vastTagUrl = (vid.adUrl && vid.adUrl.trim() !== '') ? vid.adUrl : defaultAdTag;

                setTimeout(() => {
                    if (typeof fluidPlayer === 'function') {
                        fluidPlayerInstances[uniqueId] = fluidPlayer(videoId, {
                            "layoutControls": {
                                "controlBar": { "autoHideTimeout": 3, "animated": true, "autoHide": true },
                                "autoPlay": false,
                                "mute": false,
                                "allowTheatre": true,
                                "playPauseAnimation": true,
                                "playbackRateEnabled": true,
                                "allowDownload": false,
                                "playButtonShowing": true,
                                "fillToContainer": true
                            },
                            "vastOptions": {
                                "adList": [
                                    {
                                        "roll": "preRoll",
                                        "vastTag": vastTagUrl + "&cb=" + Math.floor(Math.random() * 9999999)
                                    }
                                ],
                                "skipButtonCaption": "Skip ad in [TIMER]",
                                "skipButtonClickCaption": "Skip Ad",
                                "adText": "Advertisement",
                                "adTextPosition": "top left"
                            }
                        });

                        const vidEl = document.getElementById(videoId);
                        if(vidEl) {
                            vidEl.addEventListener('pause', () => { resetOverlay(uniqueId); });
                            vidEl.addEventListener('ended', () => { resetOverlay(uniqueId); });
                        }
                    }
                }, 150);
            });
        }

        function resetOverlay(uniqueId) {
            const overlay = document.getElementById(`overlay-${uniqueId}`);
            if (overlay) {
                overlay.style.display = 'flex';
                overlay.style.opacity = '1';
            }
        }

        function handleVideoClick(uniqueId, videoId) {
            const overlay = document.getElementById(`overlay-${uniqueId}`);
            if(overlay) {
                overlay.style.opacity = '0';
                setTimeout(() => { overlay.style.display = 'none'; }, 200);
            }

            if (fluidPlayerInstances[uniqueId]) {
                fluidPlayerInstances[uniqueId].play();
            } else {
                const vid = document.getElementById(videoId);
                if(vid) vid.play();
            }
        }

        function renderAdminVideoList() {
            const videos = getVideos();
            const listContainer = document.getElementById('adminVideoList');
            if(!listContainer) return;
            
            listContainer.innerHTML = '';
            videos.forEach(vid => {
                const item = document.createElement('div');
                item.style.cssText = "background:#0b0312; padding:10px; border-radius:8px; margin-bottom:8px; border:1px solid #3b135c;";
                item.innerHTML = `
                    <div style="font-weight:bold; font-size:13px; color:#f3f4f6;">${vid.title}</div>
                    <div style="font-size:11px; color:#38bdf8; word-break:break-all;">📹 ${vid.url}</div>
                    <div style="font-size:11px; color:#a855f7; word-break:break-all;">📢 VAST Tag: ${vid.adUrl || defaultAdTag}</div>
                    <button class="btn-delete" onclick="deleteVideo(${vid.id})">🗑️ Delete Video</button>
                `;
                listContainer.appendChild(item);
            });
        }

        function addNewVideo() {
            const title = document.getElementById('newVideoTitle').value.trim();
            const url = document.getElementById('newVideoUrl').value.trim();
            const adUrl = document.getElementById('newVideoAdUrl').value.trim();

            if (!title || !url) {
                alert('অনুগ্রহ করে ভিডিওর টাইটেল এবং ভিডিও লিংক দিন!');
                return;
            }

            const videos = getVideos();
            videos.unshift({ id: Date.now(), title, url, adUrl });
            saveVideos(videos);

            document.getElementById('newVideoTitle').value = '';
            document.getElementById('newVideoUrl').value = '';
            document.getElementById('newVideoAdUrl').value = '';
            alert('নতুন ভিডিও এবং VAST অ্যাড সফলভাবে যুক্ত হয়েছে!');
        }

        function deleteVideo(id) {
            if (confirm("আপনি কি নিশ্চিত এই ভিডিওটি মুছে ফেলতে চান?")) {
                let videos = getVideos();
                videos = videos.filter(v => v.id !== id);
                saveVideos(videos);
            }
        }

        function closeAdmin() {
            document.getElementById('adminPanel').style.display = 'none';
        }

        if (window.location.hash === '#admin') {
            const pin = prompt("Admin Password দিন:");
            if (pin === "1234") {
                document.getElementById('adminPanel').style.display = 'block';
                renderAdminVideoList();
            } else {
                alert("ভুল পাসওয়ার্ড!");ক
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            renderVideos();
            setTimeout(() => {
                if(window.AdProvider) {
                    try { window.AdProvider.push({"serve": {}}); } catch(e){}
                }
            }, 1000);
        });
    </script>
</body>
</html>
