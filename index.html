<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- ExoClick Verification Meta Tag -->
    <meta name="6a97888e-site-verification" content="ee8486c0ac86735a657b5ada041072ef">
    
    <title>🔥 VIP Stream Hub</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        * { box-sizing: border-box; -webkit-user-select: none; user-select: none; }
        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background: #090b10;
            color: #f5f5f5;
            margin: 0;
            padding: 0;
            padding-bottom: 60px;
            text-align: center;
        }
        .header-title { color: #38bdf8; font-size: 22px; margin: 0; font-weight: 800; }
        .badge-viral {
            background: linear-gradient(135deg, #ef4444, #f97316);
            color: white; padding: 4px 14px; font-size: 11px; border-radius: 20px; font-weight: 700; display: inline-block;
        }
        .search-box { width: 100%; margin: 12px 0; position: relative; }
        .search-box input {
            width: 100%; padding: 12px 15px 12px 40px; border-radius: 25px; border: 1px solid #1f2937;
            background: #111827; color: white; font-size: 14px; outline: none;
        }
        .direct-link-btn {
            display: block; background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white; text-decoration: none; padding: 14px; border-radius: 12px;
            font-weight: 700; font-size: 14px; margin: 12px 0; box-shadow: 0 4px 14px rgba(239, 68, 68, 0.4);
            cursor: pointer; transition: transform 0.1s;
        }
        .direct-link-btn:active { transform: scale(0.98); }
        .card { background: #111827; border: 1px solid #1f2937; border-radius: 16px; padding: 14px; margin-bottom: 16px; text-align: left; }
        .video-card { background: #0d1117; border-radius: 12px; padding: 10px; margin-bottom: 16px; border: 1px solid #1f2937; }
        .video-wrapper { position: relative; width: 100%; aspect-ratio: 16 / 9; border-radius: 8px; overflow: hidden; background: #000; }
        .video-wrapper iframe, .video-wrapper video { width: 100%; height: 100%; border: none; display: block; }
        .video-overlay-trigger {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer; z-index: 5; backdrop-filter: blur(2px);
        }
        .play-btn-circle {
            width: 50px; height: 50px; background: #ef4444; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; font-size: 22px; color: #fff;
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.8);
        }
        .ad-container { margin: 15px 0; text-align: center; overflow: hidden; }

        /* Admin Panel Styles */
        #adminPanel {
            display: none; background: #1e293b; border: 2px solid #38bdf8;
            padding: 15px; border-radius: 12px; margin: 15px; text-align: left;
        }
        #adminPanel h3 { color: #38bdf8; margin-top: 0; }
        #adminPanel label { font-size: 12px; color: #94a3b8; display: block; margin-top: 10px; }
        #adminPanel textarea {
            width: 100%; background: #0f172a; border: 1px solid #334155;
            color: #fff; padding: 8px; border-radius: 6px; font-family: monospace; font-size: 12px;
        }
        #adminPanel button {
            background: #22c55e; color: white; border: none; padding: 10px 18px;
            border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 12px; width: 100%;
        }
    </style>
</head>
<body>

    <!-- Dynamic Admin Panel -->
    <div id="adminPanel">
        <h3>⚙️ Ad Manager Control Panel</h3>
        <label>Top Banner Ad Code (Header):</label>
        <textarea id="topAdInput" rows="3" placeholder="Paste Top Ad Code Here"></textarea>

        <label>In-Between Video Ad Code (Middle):</label>
        <textarea id="middleAdInput" rows="3" placeholder="Paste Video-Middle Ad Code Here"></textarea>

        <label>Bottom Banner Ad Code (Footer):</label>
        <textarea id="bottomAdInput" rows="3" placeholder="Paste Bottom Ad Code Here"></textarea>

        <button onclick="saveAds()">Save & Update All Ads</button>
    </div>

    <div style="padding: 15px;">
        <span class="badge-viral">VIP VIP STREAM</span>
        <h1 class="header-title">🔥 VIP Stream Hub</h1>

        <!-- Top Ad Placement -->
        <div id="top-ad-slot" class="ad-container"></div>

        <a href="https://t.me/your_channel" class="direct-link-btn" target="_blank">
            <i class="fab fa-telegram-plane"></i> VIP টেলিগ্রাম চ্যানেলে জয়েন করুন
        </a>

        <!-- Video 1 -->
        <div class="video-card">
            <h3 style="font-size: 14px; margin-bottom: 8px;">ওরে ভাই কি করা করে 🥵🔞</h3>
            <div class="video-wrapper">
                <div class="video-overlay-trigger" onclick="playVideo(this)">
                    <div class="play-btn-circle"><i class="fas fa-play"></i></div>
                    <span style="margin-top: 8px; font-weight: bold; font-size: 13px;">ভিডিও প্লে করতে ক্লিক করুন</span>
                </div>
                <video controls preload="metadata">
                    <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
                </video>
            </div>
        </div>

        <!-- Middle Ad Placement (Video 1 & 2-এর মাঝখানে) -->
        <div id="middle-ad-slot" class="ad-container"></div>

        <!-- Video 2 -->
        <div class="video-card">
            <h3 style="font-size: 14px; margin-bottom: 8px;">সেরা ভিডিও 🥵🔞</h3>
            <div class="video-wrapper">
                <div class="video-overlay-trigger" onclick="playVideo(this)">
                    <div class="play-btn-circle"><i class="fas fa-play"></i></div>
                    <span style="margin-top: 8px; font-weight: bold; font-size: 13px;">ভিডিও প্লে করতে ক্লিক করুন</span>
                </div>
                <video controls preload="metadata">
                    <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
                </video>
            </div>
        </div>

        <!-- Bottom Ad Placement -->
        <div id="bottom-ad-slot" class="ad-container"></div>
    </div>

    <script>
        // Video Play Handling
        function playVideo(element) {
            element.style.display = 'none';
            const video = element.nextElementSibling;
            if (video) {
                video.play();
            }
        }

        // Script-inclusive Dynamic Render Method
        function setAdContent(elementId, code) {
            const container = document.getElementById(elementId);
            if (!container || !code) return;
            container.innerHTML = '';
            
            const range = document.createRange();
            range.selectNode(container);
            const fragment = range.createContextualFragment(code);
            container.appendChild(fragment);
        }

        // Load Saved Ads from LocalStorage
        function loadAds() {
            setAdContent('top-ad-slot', localStorage.getItem('topAd'));
            setAdContent('middle-ad-slot', localStorage.getItem('middleAd'));
            setAdContent('bottom-ad-slot', localStorage.getItem('bottomAd'));

            if (document.getElementById('topAdInput')) {
                document.getElementById('topAdInput').value = localStorage.getItem('topAd') || '';
                document.getElementById('middleAdInput').value = localStorage.getItem('middleAd') || '';
                document.getElementById('bottomAdInput').value = localStorage.getItem('bottomAd') || '';
            }
        }

        // Save Ads Function
        function saveAds() {
            const topCode = document.getElementById('topAdInput').value;
            const middleCode = document.getElementById('middleAdInput').value;
            const bottomCode = document.getElementById('bottomAdInput').value;

            localStorage.setItem('topAd', topCode);
            localStorage.setItem('middleAd', middleCode);
            localStorage.setItem('bottomAd', bottomCode);

            alert('সকল অ্যাড সফলভাবে সেভ করা হয়েছে!');
            location.reload();
        }

        // Open Admin Panel via Secret URL Hash (#admin)
        if (window.location.hash === '#admin') {
            document.getElementById('adminPanel').style.display = 'block';
        }

        window.onload = loadAds;
    </script>
</body>
</html>
