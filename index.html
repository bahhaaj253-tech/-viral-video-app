<!DOCTYPE html>
<html lang="bn">
<head>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-LK8193CMKV"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-LK8193CMKV');

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>🔥 এক্সক্লুসিভ প্রিমিয়াম ভিডিও হাব</title>
  
  <!-- Monetag & Ad SDKs -->
  <script src='//libtl.com/sdk.js' data-zone='11848596' data-sdk='show_11848596'></script>
  <script>(function(s){s.dataset.zone='11873688',s.src='https://al5sm.com/tag.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    * { box-sizing: border-box; -webkit-user-select: none; user-select: none; }
    body {
      font-family: 'Segoe UI', Roboto, sans-serif;
      background: #090d16;
      color: #f1f5f9;
      margin: 0;
      padding: 12px;
      padding-bottom: 90px;
      text-align: center;
    }
    .header-title { color: #38bdf8; font-size: 20px; margin: 10px 0; font-weight: 800; }
    .badge-viral { 
      background: linear-gradient(135deg, #ef4444, #f97316); 
      color: white; padding: 4px 12px; font-size: 11px; border-radius: 20px; font-weight: 700;
    }
    .direct-link-btn {
      display: block;
      background: linear-gradient(135deg, #ef4444, #dc2626);
      color: white;
      text-decoration: none;
      padding: 14px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 14px;
      margin: 12px 0;
      box-shadow: 0 4px 12px rgba(239, 68, 68, 0.4);
      cursor: pointer;
    }
    .card { background: #111827; border: 1px solid #1f2937; border-radius: 16px; padding: 14px; margin-bottom: 16px; text-align: left; }
    .video-card { background: #030712; border-radius: 12px; padding: 10px; margin-bottom: 16px; border: 1px solid #1f2937; }
    
    /* পারফেক্ট প্লেয়ার কন্টেইনার */
    .video-wrapper {
      position: relative; width: 100%; aspect-ratio: 16 / 9; border-radius: 8px; overflow: hidden; background: #000;
    }
    .video-wrapper iframe, .video-wrapper video { 
      width: 100%; height: 100%; border: none; display: block; 
    }
    
    .video-overlay-trigger {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      cursor: pointer; z-index: 5; backdrop-filter: blur(2px);
    }
    .play-btn-circle {
      width: 60px; height: 60px; background: #ef4444; border-radius: 50%;
      display: flex; align-items: center; justify-content: center; font-size: 24px; color: #fff;
      box-shadow: 0 0 20px rgba(239, 68, 68, 0.8);
    }
    
    .hidden { display: none !important; }
    .ad-slot { margin: 10px 0; text-align: center; }
    input, textarea { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #374151; background: #111827; color: white; font-size: 12px; margin-bottom: 8px; }
    .btn-submit { background: #10b981; color: white; border: none; width: 100%; padding: 10px; border-radius: 8px; font-weight: bold; cursor: pointer; }
    
    #sticky-ad-container {
      position: fixed; bottom: 0; left: 0; width: 100%; z-index: 999;
      background: rgba(9, 13, 22, 0.95); backdrop-filter: blur(8px);
    }
  </style>
</head>
<body oncontextmenu="return false;">

  <!-- ইউজার ভিউ -->
  <div id="user-view">
    <div class="ad-slot" id="ad-top-slot"></div>
    <span class="badge-viral">🔥 Premium Stream Player</span>
    <h2 class="header-title">ভিডিও মিনি অ্যাপ</h2>

    <div class="ad-slot" id="ad-middle-slot"></div>

    <a id="top-direct-link-btn" onclick="openDirectAd()" class="direct-link-btn">
      🎁 স্পেশাল ভিআইপি ভিডিও লিংক (ক্লিক করুন)
    </a>

    <div class="card">
      <div id="video-container"></div>
    </div>
    
    <div class="ad-slot" id="ad-bottom-slot"></div>
  </div>

  <div id="sticky-ad-container" class="ad-slot"></div>
  <div id="popup-ad-slot"></div>

  <!-- এডমিন প্যানেল (URL-এ #admin লিখে খুলবেন) -->
  <div id="admin-view" class="hidden">
    <div style="max-width:450px; margin: 20px auto; background:#111827; padding:20px; border-radius:12px; text-align:left; border:1px solid #3b82f6;">
      <h3 style="color:#38bdf8; margin-top:0;">⚙️ এডমিন কন্ট্রোল প্যানেল</h3>
      
      <label style="font-size:12px; color:#38bdf8;">১. ডাইরেক্ট লিঙ্ক অ্যাড URL:</label>
      <input type="text" id="adDirectLinkInput" placeholder="https://omg10.com/4/11848732">

      <label style="font-size:12px; color:#38bdf8;">২. ভিডিও টাইটেল:</label>
      <input type="text" id="newVidTitle" placeholder="ভিডিও নাম">

      <label style="font-size:12px; color:#38bdf8;">৩. Streamable / Direct Video URL:</label>
      <input type="text" id="newVidUrl" placeholder="https://streamable.com/2qd0h1">

      <button class="btn-submit" onclick="addVideoFromAdmin()">ভিডিও যুক্ত করুন</button>

      <hr style="border-color:#1f2937; margin:15px 0;">

      <label style="font-size:12px; color:#f59e0b;">টপ ব্যানার অ্যাড (HTML Code):</label>
      <textarea id="adTopInput" rows="2"></textarea>

      <label style="font-size:12px; color:#f59e0b;">মিডল ব্যানার অ্যাড (HTML Code):</label>
      <textarea id="adMiddleInput" rows="2"></textarea>

      <label style="font-size:12px; color:#f59e0b;">বটম ব্যানার অ্যাড (HTML Code):</label>
      <textarea id="adBottomInput" rows="2"></textarea>

      <label style="font-size:12px; color:#f59e0b;">পপ-আপ / পপ-আন্ডার অ্যাড (PopUp Code):</label>
      <textarea id="adPopupInput" rows="2"></textarea>

      <label style="font-size:12px; color:#f59e0b;">স্টিকি বটম অ্যাড (Sticky Code):</label>
      <textarea id="adStickyInput" rows="2"></textarea>

      <button class="btn-submit" onclick="saveAdSettings()" style="background:#3b82f6; margin-top:10px;">সব সেটিংস সেভ করুন</button>
    </div>
  </div>

  <script>
    const DEFAULT_DIRECT_LINK = "https://omg10.com/4/11848732";

    // ১০০% গ্যারান্টিড অ্যাড ট্রিপল ফাংশন (about:blank মুক্ত)
    function openDirectAd() {
      const ads = JSON.parse(localStorage.getItem('app_ads_config')) || {};
      const directUrl = ads.directLink || DEFAULT_DIRECT_LINK;
      
      const a = document.createElement('a');
      a.href = directUrl;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.click();
    }

    function playVideoWithAd(id) {
      // ১. ডাইরেক্ট লিঙ্ক অ্যাড ওপেন
      openDirectAd();

      // ২. Monetag SDK রিফ্রেশ
      if (typeof window.show_11848596 === 'function') {
        window.show_11848596({ type: 'inApp' }).catch(e => console.log(e));
      }

      // ৩. ভিডিও চালু
      const overlay = document.getElementById(`overlay-${id}`);
      if(overlay) overlay.style.display = 'none';

      const vidElem = document.getElementById(`vid-${id}`);
      if(vidElem) {
        if(vidElem.tagName === 'IFRAME') {
          let src = vidElem.src;
          if(!src.includes('autoplay=1')) {
            vidElem.src = src + (src.includes('?') ? '&autoplay=1' : '?autoplay=1');
          }
        } else if(vidElem.tagName === 'VIDEO') {
          vidElem.play();
        }
      }
    }

    // লিঙ্ক স্ট্রিমঅ্যাবল হলে ওটাকে Embed ফর্মে রূপান্তর
    function formatVideoUrl(url) {
      let trimmed = url.trim();
      if (trimmed.includes('streamable.com')) {
        let match = trimmed.match(/streamable\.com\/([a-zA-Z0-9]+)/);
        if (match && match[1]) {
          return { type: 'iframe', url: `https://streamable.com/e/${match[1]}?autoplay=1` };
        }
      }
      if (trimmed.includes('iframe') || trimmed.includes('<iframe')) {
        let match = trimmed.match(/src=["']([^"']+)["']/i);
        if(match) return { type: 'iframe', url: match[1] };
      }
      return { type: 'video', url: trimmed };
    }

    function renderVideos(videos) {
      const container = document.getElementById('video-container');
      container.innerHTML = "";

      videos.forEach((v) => {
        let srcObj = formatVideoUrl(v.url);
        let videoContent = "";

        if (srcObj.type === 'iframe') {
          videoContent = `<iframe id="vid-${v.id}" src="${srcObj.url}" allow="autoplay; fullscreen" allowfullscreen></iframe>`;
        } else {
          videoContent = `<video id="vid-${v.id}" controls playsinline preload="metadata"><source src="${srcObj.url}" type="video/mp4"></video>`;
        }

        container.innerHTML += `
          <div class="video-card">
            <div style="margin-bottom:8px; font-weight:bold; font-size:14px; color:#38bdf8;">${v.title}</div>
            <div class="video-wrapper">
              ${videoContent}
              <div class="video-overlay-trigger" id="overlay-${v.id}" onclick="playVideoWithAd(${v.id})">
                <div class="play-btn-circle"><i class="fa-solid fa-play"></i></div>
                <span style="font-size:12px; margin-top:10px; font-weight:bold; color:#fff;">ভিডিও দেখতে ক্লিক করুন</span>
              </div>
            </div>
          </div>
        `;
      });
    }

    function checkAdminView() {
      if (window.location.search.includes('admin') || window.location.hash.includes('admin')) {
        document.getElementById('user-view').classList.add('hidden');
        document.getElementById('admin-view').classList.remove('hidden');
      }
    }

    function addVideoFromAdmin() {
      const title = document.getElementById('newVidTitle').value.trim();
      const url = document.getElementById('newVidUrl').value.trim();
      if (!title || !url) return alert('ভিডিও নাম ও লিঙ্ক সঠিকভাবে দিন!');

      let appVideos = JSON.parse(localStorage.getItem('app_custom_videos')) || [];
      appVideos.unshift({ id: Date.now(), title, url });
      localStorage.setItem('app_custom_videos', JSON.stringify(appVideos));
      alert('ভিডিও যুক্ত হয়েছে!');
      location.reload();
    }

    function saveAdSettings() {
      const adsConfig = {
        directLink: document.getElementById('adDirectLinkInput').value || DEFAULT_DIRECT_LINK,
        top: document.getElementById('adTopInput').value,
        middle: document.getElementById('adMiddleInput').value,
        bottom: document.getElementById('adBottomInput').value,
        popup: document.getElementById('adPopupInput').value,
        sticky: document.getElementById('adStickyInput').value
      };
      localStorage.setItem('app_ads_config', JSON.stringify(adsConfig));
      alert('সব অ্যাড সেটিংস সেভ করা হয়েছে!');
      renderAds();
    }

    function executeAdScripts(container, htmlContent) {
      container.innerHTML = '';
      if(!htmlContent || !htmlContent.trim()) return;

      container.innerHTML = htmlContent;
      const scripts = container.getElementsByTagName('script');
      for (let i = 0; i < scripts.length; i++) {
        const script = document.createElement('script');
        if (scripts[i].src) { script.src = scripts[i].src; } 
        else { script.textContent = scripts[i].textContent; }
        document.body.appendChild(script);
      }
    }

    function renderAds() {
      const ads = JSON.parse(localStorage.getItem('app_ads_config')) || {};
      if(document.getElementById('ad-top-slot')) executeAdScripts(document.getElementById('ad-top-slot'), ads.top || '');
      if(document.getElementById('ad-middle-slot')) executeAdScripts(document.getElementById('ad-middle-slot'), ads.middle || '');
      if(document.getElementById('ad-bottom-slot')) executeAdScripts(document.getElementById('ad-bottom-slot'), ads.bottom || '');
      if(document.getElementById('popup-ad-slot')) executeAdScripts(document.getElementById('popup-ad-slot'), ads.popup || '');
      if(document.getElementById('sticky-ad-container')) executeAdScripts(document.getElementById('sticky-ad-container'), ads.sticky || '');
      
      if(document.getElementById('adDirectLinkInput')) {
        document.getElementById('adDirectLinkInput').value = ads.directLink || DEFAULT_DIRECT_LINK;
        document.getElementById('adTopInput').value = ads.top || '';
        document.getElementById('adMiddleInput').value = ads.middle || '';
        document.getElementById('adBottomInput').value = ads.bottom || '';
        document.getElementById('adPopupInput').value = ads.popup || '';
        document.getElementById('adStickyInput').value = ads.sticky || '';
      }
    }

    window.onload = function() {
      checkAdminView();
      // আপনার Streamable লিঙ্ক দিয়ে ডিফল্ট ভিডিও সেট করা হলো
      const videos = JSON.parse(localStorage.getItem('app_custom_videos')) || [
        { id: 1, title: "ভাইরাল ভিডিও ১", url: "https://streamable.com/2qd0h1" }
      ];
      renderVideos(videos);
      renderAds();
    };
  </script>
</body>
</html>
